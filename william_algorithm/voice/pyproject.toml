[project]
name = "voice"
version = "0.1.0"
description = "Audio pipeline for voice analysis"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.116.1",
    "httpx[socks]>=0.28.1",
    "librosa>=0.10.2",
    "llvmlite>=0.41.0,<0.44.0",
    "numba>=0.58.0,<0.60.0",
    "numpy>=1.26.0",
    "openai>=1.109.1",
    "opensmile>=2.6.0",
    "pandas>=2.2.2",
    "protobuf>=6.33.5",
    "python-multipart>=0.0.20",
    "scipy>=1.14.0",
    "soundfile>=0.12.1",
    "torch>=2.0.0,<2.3.0",
    "transformers>=4.44.0",
    "uvicorn>=0.35.0",
    "webrtcvad>=2.0.10",
    "faster-whisper>=1.0.0",
    "onnxruntime>=1.16.0,<1.20.0",
    "yt-dlp>=2026.3.13",
    "python-dotenv>=1.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["audio_pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
